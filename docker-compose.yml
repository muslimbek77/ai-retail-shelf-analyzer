services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://shelf:shelf@db:5432/shelf_analyzer
      YOLO_MODEL: yolov8n.pt
    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shelf_analyzer
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: shelf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf -d shelf_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
volumes:
  postgres_data:
